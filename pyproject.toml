[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaveragent"
version = "0.1.0"
description = "Universal AI agent framework: unified LLM interface, ReAct and Plan-Execute reasoning, pluggable tools, persistent memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Timothy Weaver" }]
keywords = ["ai", "agents", "llm", "react", "tool-use", "anthropic", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0.0"]
openai = ["openai>=1.40.0"]
all = ["anthropic>=1.0.0", "openai>=1.40.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.8"]

[project.urls]
Homepage = "https://github.com/tlweave2/WeaverAgent"
Repository = "https://github.com/tlweave2/WeaverAgent"

[project.scripts]
weaveragent = "weaveragent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
